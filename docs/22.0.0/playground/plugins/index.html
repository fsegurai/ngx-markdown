<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ngx-markdown plugins</title>
    <!-- Styles of the global libraries: the Prism line numbers plugin and KaTeX. The Prism token colors are in
         styles.css, with one palette for the light theme and one for the dark theme. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/plugins/line-numbers/prism-line-numbers.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.css" />
  </head>
  <body>
    <app-root>Loading Angular…</app-root>
    <!-- The plugins read these globals: Prism (+ languages and plugins), joypixels and katex -->
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-typescript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/emoji-toolkit@11.0.0/lib/js/joypixels.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.js"></script>
  </body>
</html>
